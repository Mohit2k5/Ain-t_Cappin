# ============================================================
# Ain't Cappin — Docker Compose
# Local development & integration testing environment
#
# Services:
#   backend  — FastAPI + Uvicorn (port 8000)
#   frontend — Vite static build served by nginx (port 3000)
#
# Usage:
#   cp backend/.env.example backend/.env   # fill in your API keys
#   docker compose up --build
# ============================================================
version: 'v1'
services:

  # ----------------------------------------------------------
  # Backend — FastAPI fact-checking API
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aint-cappin-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      # Copy backend/.env.example → backend/.env and fill your keys.
      # This file is git-ignored; never commit real secrets.
      - ./backend/.env
    environment:
      ENVIRONMENT: production
      PORT: "8000"
      # Allow requests from the local nginx preview and CF Pages dev URL.
      # In production, replace with your actual CF Pages domain.
      ALLOWED_ORIGINS: >-
        http://localhost:3000,
        http://127.0.0.1:3000,
        http://localhost:5173,
        https://your-project.pages.dev
      # Model cache: persisted via named volume so models aren't
      # re-downloaded on every container restart.
      HF_HOME: /app/.cache/huggingface
      TRANSFORMERS_CACHE: /app/.cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /app/.cache/sentence_transformers
    volumes:
      # Persist Hugging Face / sentence-transformer model weights between runs
      - hf_model_cache:/app/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 90s   # Give extra time for first-run model download
      retries: 5
    networks:
      - aint-cappin-net

  # ----------------------------------------------------------
  # Frontend — React/Vite static build (nginx preview)
  # This mirrors what Cloudflare Pages will serve.
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # This is baked into the Vite bundle at build time.
        # In Cloudflare Pages production, set this in:
        #   Settings → Environment variables → VITE_API_BASE_URL
        # For local compose testing it points to the backend service.
        VITE_API_BASE_URL: http://localhost:8000
    container_name: aint-cappin-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 20s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - aint-cappin-net

# ----------------------------------------------------------
# Volumes
# ----------------------------------------------------------
volumes:
  hf_model_cache:
    name: aint-cappin-hf-model-cache
    # Remove this volume to force a fresh model download:
    #   docker volume rm aint-cappin-hf-model-cache

# ----------------------------------------------------------
# Networks
# ----------------------------------------------------------
networks:
  aint-cappin-net:
    name: aint-cappin-network
    driver: bridge
